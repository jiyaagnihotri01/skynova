services:
  - type: web
    name: skypulse-customer-intelligence
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://skypulse.vercel.app,https://skypulse-customer-intelligence.vercel.app,http://localhost:5173,http://localhost:5174
